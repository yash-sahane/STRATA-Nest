version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ltconnect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  web:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ltconnect
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
    volumes:
      - .:/app

  worker:
    build: .
    command: celery -A config worker -l info
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ltconnect
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]
    volumes:
      - .:/app

  beat:
    build: .
    command: celery -A config beat -l info
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ltconnect
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]
    volumes:
      - .:/app

volumes:
  pg_data:
