[project]
name = "lt-connect-backend"
version = "0.1.0"
description = "Django backend for L-T-Connect"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.0,<5.2",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-filter>=24.0",
    "django-cors-headers>=4.3",
    "django-environ>=0.11",
    "channels>=4.0",
    "channels-redis>=4.2",
    "daphne>=4.1",
    "celery>=5.3",
    "redis>=5.0",
    "psycopg[binary]>=3.1",
    "django-storages[s3]>=1.14",
    "Pillow>=10.0",
    "drf-spectacular>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "ipython>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*"]
