# Reverse proxy for the NestJS API + WebSocket upgrade (arch §13).
worker_processes auto;
events { worker_connections 1024; }

http {
  upstream lt_api { server api:8000; }

  # WebSocket upgrade mapping
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 25m; # file uploads (A§6.13)

    # REST
    location /api/ {
      proxy_pass http://lt_api;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (Socket.IO) — preserves the /ws/collections/ contract (A§7)
    location /ws/ {
      proxy_pass http://lt_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host       $host;
      proxy_read_timeout 3600s;
    }
  }
}
